line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]
ignore = ["S101", "E501", "DJ001", "DJ008"]  # assert en tests; líneas largas y null en CharField permitidos (diccionario de datos)

[lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"apps/seeds/**" = ["S105", "S106"]
