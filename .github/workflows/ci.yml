name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fyag
          POSTGRES_PASSWORD: fyag
          POSTGRES_DB: fyag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fyag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://fyag:fyag@localhost:5432/fyag
      DJANGO_SECRET_KEY: ci-secret-no-usar-en-produccion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      # Activar cuando el Manager corra una vez `ruff format .` y suba el resultado (ver README, Primer día).
      - name: Formato (ruff format)
        if: ${{ hashFiles('backend/.ruff-format-ok') != '' }}
        run: ruff format --check .
      # Activo cuando la Base de datos suba las migraciones iniciales (Sprint 0).
      - name: Migraciones al día
        if: ${{ hashFiles('backend/apps/accounts/migrations/0001_initial.py') != '' }}
        run: python manage.py makemigrations --check --dry-run
      - run: pytest
      - run: pip-audit -r requirements/base.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Cuando exista pnpm-lock.yaml, el CI usa --frozen-lockfile.
      - run: pnpm install ${{ hashFiles('frontend/pnpm-lock.yaml') != '' && '--frozen-lockfile' || '' }}
      - run: pnpm run typecheck
      - run: pnpm run --if-present lint
      - run: pnpm run --if-present test
      - run: pnpm run build
      - run: pnpm audit --audit-level high
