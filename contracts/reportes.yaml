openapi: 3.0.3
info:
  title: FYAG — reportes
  version: 0.1.0
  description: "Dueño Base de datos. BORRADOR de rutas y roles; completar los schemas antes del dom 8 nov."
servers:
  - url: /api/v1
paths:
  /reportes/obras/:
    get:
      summary: "Obras filtradas; formato=json|xlsx|pdf; filtros desde, hasta, id_cliente, id_tecnico, estado"
      x-roles: [GERENCIA, ADMINISTRATIVO, SUPERVISOR]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /reportes/cobranzas/:
    get:
      summary: "Cobranzas filtradas; formato=json|xlsx|pdf"
      x-roles: [GERENCIA, ADMINISTRATIVO]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}

components:
  responses:
    Error:
      description: Error con formato uniforme
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, example: OBRA_SIN_TECNICO}
            message: {type: string, example: Debe asignar al menos un técnico}
            details: {type: object}
    # TODO(dueño): definir aquí los schemas de entrada y salida de este módulo
    # (tipos, largos, rangos) y referenciarlos en los endpoints con $ref. Ver contracts/examples/.
