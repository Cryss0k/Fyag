openapi: 3.0.3
info:
  title: FYAG — presupuestos
  version: 0.1.0
  description: "Dueño Back 1. BORRADOR de rutas y roles; completar los schemas antes del dom 8 nov."
servers:
  - url: /api/v1
paths:
  /presupuestos/:
    get:
      summary: "Listar presupuestos. SUPERVISOR: solo lectura y solo APROBADOS (filtro sin_obra=true para crear fichas)"
      x-roles: [GERENCIA, ADMINISTRATIVO, SUPERVISOR]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      summary: "Crear presupuesto con ítems (calcula subtotal, IVA 19 % y total)"
      x-roles: [GERENCIA, ADMINISTRATIVO]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /presupuestos/{id_presupuesto}/:
    get:
      summary: "Detalle con ítems. SUPERVISOR: solo si está APROBADO"
      x-roles: [GERENCIA, ADMINISTRATIVO, SUPERVISOR]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    patch:
      summary: "Editar (solo en BORRADOR)"
      x-roles: [GERENCIA, ADMINISTRATIVO]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /presupuestos/{id_presupuesto}/enviar/:
    post:
      summary: "BORRADOR a ENVIADO"
      x-roles: [GERENCIA, ADMINISTRATIVO]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /presupuestos/{id_presupuesto}/aprobar/:
    post:
      summary: "ENVIADO a APROBADO (D-01: solo Gerencia)"
      x-roles: [GERENCIA]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /presupuestos/{id_presupuesto}/rechazar/:
    post:
      summary: "ENVIADO a RECHAZADO (D-01: solo Gerencia)"
      x-roles: [GERENCIA]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /presupuestos/{id_presupuesto}/pdf/:
    get:
      summary: "PDF institucional (HDU-04, Could)"
      x-roles: [GERENCIA, ADMINISTRATIVO]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}

components:
  responses:
    Error:
      description: Error con formato uniforme
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, example: OBRA_SIN_TECNICO}
            message: {type: string, example: Debe asignar al menos un técnico}
            details: {type: object}
    # TODO(dueño): definir aquí los schemas de entrada y salida de este módulo
    # (tipos, largos, rangos) y referenciarlos en los endpoints con $ref. Ver contracts/examples/.
