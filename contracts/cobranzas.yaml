openapi: 3.0.3
info:
  title: FYAG — cobranzas
  version: 0.1.0
  description: "Dueño Back 2. BORRADOR de rutas y roles; completar los schemas antes del dom 8 nov."
servers:
  - url: /api/v1
paths:
  /facturas/:
    get:
      summary: "Listar facturas (filtros: obra, estado, vencidas)"
      x-roles: [GERENCIA, ADMINISTRATIVO]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      summary: "Registrar factura asociada a una obra"
      x-roles: [GERENCIA, ADMINISTRATIVO]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /facturas/{id_factura}/:
    get:
      summary: "Detalle de factura"
      x-roles: [GERENCIA, ADMINISTRATIVO]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /facturas/{id_factura}/pago/:
    post:
      summary: "Registrar pago (PENDIENTE a PAGADO)"
      x-roles: [GERENCIA, ADMINISTRATIVO]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /facturas/{id_factura}/anular/:
    post:
      summary: "Anular con motivo (no se eliminan facturas)"
      x-roles: [GERENCIA, ADMINISTRATIVO]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /obras/{id_obra}/costos/:
    get:
      summary: "Listar costos de la obra"
      x-roles: [GERENCIA, ADMINISTRATIVO]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      summary: "Registrar costo"
      x-roles: [GERENCIA, ADMINISTRATIVO]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
  /obras/{id_obra}/rentabilidad/:
    get:
      summary: "Rentabilidad = facturado no anulado - costos"
      x-roles: [GERENCIA, ADMINISTRATIVO]
      responses:
        "200": {description: OK}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}

components:
  responses:
    Error:
      description: Error con formato uniforme
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, example: OBRA_SIN_TECNICO}
            message: {type: string, example: Debe asignar al menos un técnico}
            details: {type: object}
    # TODO(dueño): definir aquí los schemas de entrada y salida de este módulo
    # (tipos, largos, rangos) y referenciarlos en los endpoints con $ref. Ver contracts/examples/.
